<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile Section</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .profile {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .profile img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .role {
      color: #666;
      margin-bottom: 20px;
    }

    .info {
      text-align: left;
      line-height: 2;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    function Profile() {
      return (
        <div className="container">

          <div className="profile">

            <img
              src="https://i.pravatar.cc/300"
              alt="Profile"
            />

            <h1>My Profile</h1>

            <p className="role">
              React Developer
            </p>

            <div className="info">
              <p>📧 Email: myemail@gmail.com</p>
              <p>📱 Phone: +91 9876543210</p>
              <p>📍 Location: India</p>
            </div>

            <button>
              Follow
            </button>

          </div>

        </div>
      );
    }

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(<Profile />);

  </script>

</body>
</html>
