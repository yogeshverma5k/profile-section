<!DOCTYPE html>
<html>
<head>
  <title>My Profile</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #141e30, #243b55);
    }

    .container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 330px;
      padding: 30px;
      text-align: center;
      background: white;
      border-radius: 25px;
    }

    .photo {
      font-size: 70px;
    }

    h1 {
      margin-bottom: 5px;
    }

    h3 {
      color: #526d82;
    }

    .skills span {
      display: inline-block;
      padding: 8px 12px;
      margin: 5px;
      background: #e8eef5;
      border-radius: 20px;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 20px;
      background: #243b55;
      color: white;
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">

    function Profile() {
      return (
        <div className="container">
          <div className="card">

            <div className="photo">👨‍💻</div>

            <h1>Yogesh Verma</h1>

            <h3>React Developer</h3>

            <p>
              I am learning React and building modern websites.
            </p>

            <div className="skills">
              <span>HTML</span>
              <span>CSS</span>
              <span>JavaScript</span>
              <span>React</span>
            </div>

            <button>Contact Me</button>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(<Profile />);

  </script>

</body>
</html>
